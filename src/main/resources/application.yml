spring:
  profiles:
    active: prod
  config:
    import:
      "configserver:http://config-server:8888"

  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 3000
        max-interval: 10000
        max-attempts: 10
        multiplier: 1.5
      name: auth-service

    consul:
      host: ${CONSUL_HOST:consul-client}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: ${SPRING_APPLICATION_NAME:auth-service}
        instance-id: ${spring.application.name:auth-service}:${server.port}
        prefer-ip-address: true
        health-check-path: ${MANAGEMENT_ENDPOINT_BASE_PATH:/internal/actuator}/health
        health-check-interval: 15s
        health-check-timeout: 5s
        health-check-critical-timeout: 30m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
